<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkauf</title>
<!-- Startseite der App: Einkaufsliste, Rezepte, Essensplan -->
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Handschrift nur für die Einkaufslisten-Kachel – als Hinweis auf den Notizblock */
  @font-face {
    font-family: "Kuli";
    src: url("schrift.woff") format("woff");
    font-weight: 400 700;
  }
  :root {
    --hg: #f4f2ee;
    --karte: #ffffff;
    --text: #1d1d1f;
    --text2: #6e6c69;
    --linie: #e7e3dc;
    --gruen: #2e8b4f;
    --gruen-hell: #e6f3ea;
    --rot: #c2402f;
    --tinte: #1d3c8f;
    --papier: #fdfbf3;
    --papier-linie: #b8d0e8;
    --orange: #d9822b;
    --orange-hell: #fbefe1;
    --schatten: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--hg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.4;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .app { max-width: 640px; margin: 0 auto; }
  .datum { color: var(--text2); font-size: 15px; margin: 8px 0 0; }
  h1 { font-size: 32px; line-height: 1.15; margin: 2px 0 20px; letter-spacing: -.01em; }

  /* ---------- Kacheln ---------- */
  .kacheln {
    display: grid; gap: 12px;
    grid-template-columns: 1fr 1fr;
  }
  .kachel {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 168px; padding: 16px;
    border-radius: 20px; box-shadow: var(--schatten);
    background: var(--karte); color: var(--text); text-decoration: none;
    transition: transform .12s;
  }
  .kachel:active { transform: scale(.98); }
  .kachel .symbol {
    position: absolute; top: 16px; left: 16px;
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .kachel .symbol svg { width: 24px; height: 24px; }
  .kachel .titel { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .kachel .info { font-size: 14px; color: var(--text2); margin-top: 2px; }

  /* 1: Einkaufsliste – liniertes Papier */
  .kachel.liste {
    background:
      linear-gradient(to right, transparent 30px, #e8a3a3 30px, #e8a3a3 32px, transparent 32px),
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--papier-linie) 27px 28px),
      var(--papier);
  }
  .kachel.liste .titel { font-family: "Kuli", cursive; font-size: 30px; color: var(--tinte); font-weight: 700; }
  .kachel.liste .info { font-family: "Kuli", cursive; font-size: 20px; color: #6b7fb8; }
  .kachel.liste .symbol { background: #e8edf8; color: var(--tinte); left: 44px; }

  /* 2: Rezepte */
  .kachel.rezepte .symbol { background: var(--gruen-hell); color: var(--gruen); }

  /* 3: Essensplan – über die ganze Breite */
  .kachel.plan { grid-column: 1 / -1; min-height: 140px; }
  .kachel.plan .symbol { background: var(--orange-hell); color: var(--orange); }
  .woche { display: flex; gap: 6px; position: absolute; top: 22px; right: 16px; }
  .woche span {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text2); background: #f4f2ee;
  }
  .woche span.voll { background: var(--orange-hell); color: var(--orange); }
  .woche span.heute { outline: 2px solid var(--orange); outline-offset: 1px; }

  @media (max-width: 360px) {
    .woche span { width: 22px; height: 22px; font-size: 11px; }
  }
</style>
</head>
<body>
<main class="app">
  <p class="datum" id="datum"></p>
  <h1>Was steht an?</h1>

  <nav class="kacheln">
    <a class="kachel liste" href="liste/index.html">
      <span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span>
      <span class="titel">Einkaufsliste</span>
      <span class="info" id="info-liste">&nbsp;</span>
    </a>

    <a class="kachel rezepte" href="rezepte/index.html">
      <span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2 2 0 0 0 6 21h13"/><path d="M9 7h6M9 11h4"/></svg></span>
      <span class="titel">Rezepte</span>
      <span class="info" id="info-rezepte">&nbsp;</span>
    </a>

    <a class="kachel plan" href="essensplan/index.html">
      <span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 14h3M7.5 17.5h6"/></svg></span>
      <span class="woche" id="woche" aria-hidden="true"></span>
      <span class="titel">Essensplan</span>
      <span class="info" id="info-plan">&nbsp;</span>
    </a>
  </nav>
</main>

<script>
  // Alle Teile der App teilen sich den Speicher im Browser.
  const lesen = schluessel => { try { return JSON.parse(localStorage.getItem(schluessel)); } catch (e) { return null; } };
  const tagSchluessel = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  function aktualisieren() {
    const heute = new Date();
    document.getElementById("datum").textContent =
      heute.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });

    // 1: Einkaufsliste – wie viel ist noch offen?
    const l = lesen("einkaufsliste");
    const artikel = Array.isArray(l) ? l : (l && l.artikel) || [];
    const offen = artikel.filter(a => !a.done).length;
    document.getElementById("info-liste").textContent =
      offen ? `${offen} ${offen === 1 ? "Sache" : "Sachen"} offen` : "alles erledigt";

    // 2: Rezepte – wie viele gibt es?
    const r = lesen("rezeptbuch");
    const rezepte = (r && r.rezepte) || [];
    const n = rezepte.filter(x => !x.beispiel).length || rezepte.length;
    document.getElementById("info-rezepte").textContent = n === 1 ? "1 Rezept" : `${n} Rezepte`;

    // 3: Essensplan – was gibt's heute, welche Tage sind geplant?
    const plan = lesen("essensplan") || {};
    const heuteEintrag = plan[tagSchluessel(heute)];
    let heuteText = "";
    if (heuteEintrag) {
      const titel = (heuteEintrag.rezepte || []).map(id => (rezepte.find(x => String(x.id) === String(id)) || {}).titel).filter(Boolean);
      const text = (heuteEintrag.text || "").trim().split("\n")[0];
      heuteText = [...titel, text].filter(Boolean).join(", ");
    }
    document.getElementById("info-plan").textContent = heuteText ? `Heute: ${heuteText}` : "Heute noch nichts geplant";

    const woche = document.getElementById("woche");
    woche.innerHTML = "";
    const montag = new Date(heute); montag.setDate(heute.getDate() - ((heute.getDay() + 6) % 7));
    ["M", "D", "M", "D", "F", "S", "S"].forEach((buchstabe, i) => {
      const tag = new Date(montag); tag.setDate(montag.getDate() + i);
      const e = plan[tagSchluessel(tag)];
      const span = document.createElement("span");
      span.textContent = buchstabe;
      if (e && ((e.text || "").trim() || (e.rezepte || []).length)) span.classList.add("voll");
      if (tag.toDateString() === heute.toDateString()) span.classList.add("heute");
      woche.appendChild(span);
    });
  }

  aktualisieren();
  // Beim Zurückkommen aus einem Teil der App die Zahlen frisch anzeigen
  window.addEventListener("pageshow", aktualisieren);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) aktualisieren(); });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
